services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certificates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certificates"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/certificates
      STORAGE_DIR: /app/storage/certificates
      PROCESSING_MODE: celery
    volumes:
      - certificate_storage:/app/storage/certificates
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/certificates
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      STORAGE_DIR: /app/storage/certificates
      MAX_RECIPIENTS_PER_JOB: 5000
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - certificate_storage:/app/storage/certificates
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/certificates
      REDIS_URL: redis://redis:6379/0
      PROCESSING_MODE: celery
      STORAGE_DIR: /app/storage/certificates
      MAX_RECIPIENTS_PER_JOB: 5000
    volumes:
      - certificate_storage:/app/storage/certificates
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

volumes:
  postgres_data:
  certificate_storage:
